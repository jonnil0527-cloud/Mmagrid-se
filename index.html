<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MMAgrid – Ranking, viktklasser och info om UFC</title>
<meta name="description" content="Allt om UFC: rankinglistor för alla viktklasser, mästare, kommande galor, jämförelse av fighters och senaste highlights.">
<meta name="theme-color" content="#141012">
<meta property="og:type" content="website">
<meta property="og:title" content="MMAgrid – Ranking, galor och fighterjämförelse">
<meta property="og:description" content="Rankinglistor, mästare, kommande galor, fighterjämförelse och highlights från de senaste eventen.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A5%8A%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#141012;--fg:#f4f1f1;--card:#1d181a;--muted:#b9acab;--primary:#e0413a;--primary-fg:#fff;
  --accent:#2a2224;--border:rgba(255,255,255,.1);--gold:#e8c26a;--overlay:rgba(20,16,18,.55);
  --sans:"Inter",ui-sans-serif,system-ui,sans-serif;--display:"Oswald","Arial Narrow",ui-sans-serif,sans-serif;
  color-scheme:dark;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){--bg:#faf7f6;--fg:#1c1517;--card:#fff;--muted:#6d605f;--primary:#c92f29;--accent:#efe8e7;--border:rgba(0,0,0,.12);--gold:#9a7418;--overlay:rgba(250,247,246,.4);color-scheme:light}
}
:root[data-theme="light"]{--bg:#faf7f6;--fg:#1c1517;--card:#fff;--muted:#6d605f;--primary:#c92f29;--accent:#efe8e7;--border:rgba(0,0,0,.12);--gold:#9a7418;--overlay:rgba(250,247,246,.4);color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
.wrap{max-width:72rem;margin:0 auto;padding:0 1rem}
.display{font-family:var(--display);text-transform:uppercase;font-weight:600;letter-spacing:.02em;margin:0}
.eyebrow{font-size:.72rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--primary);margin:0}
.muted{color:var(--muted)}
.rec{font-variant-numeric:tabular-nums}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:4rem;gap:1rem}
.brand{display:flex;align-items:center;gap:.6rem}
.brand b{font-family:var(--display);font-weight:600;font-size:1.05rem;letter-spacing:.16em;text-transform:uppercase}
.mark{position:relative;width:2.2rem;height:2.2rem;display:grid;place-items:center;color:var(--primary)}
.mark svg{position:absolute;inset:0;width:100%;height:100%}
.mark span{position:relative;font-family:var(--display);font-weight:600;font-size:.85rem;color:#fff}
nav.main{display:flex;gap:.15rem;font-size:.88rem;font-weight:500}
nav.main a{padding:.5rem .7rem;border-radius:.5rem;color:var(--muted);transition:color .15s,background .15s}
nav.main a:hover{color:var(--fg)}
nav.main a.active{background:var(--accent);color:var(--fg)}
.btn{display:inline-flex;align-items:center;min-height:2.75rem;padding:0 1.25rem;border-radius:.6rem;font-size:.85rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;border:1px solid transparent;transition:transform .15s,background .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--primary);color:var(--primary-fg)}
.btn.ghost{border-color:color-mix(in srgb,var(--fg) 25%,transparent);background:color-mix(in srgb,var(--bg) 40%,transparent)}
.hero{position:relative;min-height:78vh;display:flex;align-items:flex-end;overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .o1{position:absolute;inset:0;background:var(--overlay)}
.hero .o2{position:absolute;inset:0;background:linear-gradient(to top,var(--bg),color-mix(in srgb,var(--bg) 70%,transparent) 45%,color-mix(in srgb,var(--bg) 25%,transparent))}
.hero .in{position:relative;z-index:1;width:100%;padding-top:6rem;padding-bottom:2.5rem}
.hero h1{font-size:clamp(3.6rem,15vw,7.5rem);line-height:.92;margin-top:.75rem}
.hero h1 span{display:block;opacity:.9}
.hero p.lead{max-width:34rem;margin:1.25rem 0 0;line-height:1.6;opacity:.85}
.row-btns{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:2rem}
.stats{display:grid;grid-template-columns:repeat(2,1fr);margin:3rem 0 0;border-top:1px solid var(--border)}
.stats div{padding:1rem .25rem}
.stats dt{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.stats dd{margin:0;font-family:var(--display);font-weight:600;font-size:2rem}
@media(min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}.stats div{padding:1rem 1.25rem;border-left:1px solid var(--border)}.stats div:first-child{border-left:0;padding-left:.25rem}}
section.block{padding:4rem 0}
.about{border-bottom:1px solid var(--border)}
.about .wrap{display:grid;gap:2rem}
@media(min-width:768px){.about .wrap{grid-template-columns:.8fr 1.2fr}}
.about p{color:var(--muted);line-height:1.7;font-size:.95rem;margin:0 0 1rem}
h2.display{font-size:clamp(2rem,6vw,3rem);margin-top:.4rem}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;margin-bottom:1.5rem}
.head a{font-size:.88rem;font-weight:500;color:var(--primary);white-space:nowrap}
.head a:hover{text-decoration:underline}
.grid{display:grid;gap:.75rem}
@media(min-width:640px){.grid.c2,.grid.c3{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1024px){.grid.c3{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--card);border:1px solid var(--border);border-radius:.9rem;padding:1.25rem}
.card.link{display:block;transition:transform .15s,border-color .15s}
.card.link:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--primary) 55%,transparent)}
.card .top{display:flex;justify-content:space-between;align-items:baseline;gap:.75rem;font-size:.78rem;color:var(--muted)}
.card .top .n{font-family:var(--display);letter-spacing:.14em}
.card h3{margin:.75rem 0 0;font-size:1.5rem}
.champ{margin-top:1.25rem;padding-top:1rem;border-top:1px solid var(--border)}
.champ small{font-size:.7rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.champ p{margin:.25rem 0 0;font-weight:500}
.champ .rec{font-size:.88rem;color:var(--muted);font-weight:400}
.next small{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.next h3{font-family:var(--sans);text-transform:none;font-size:1.05rem;font-weight:600;margin:.5rem 0 0;letter-spacing:0}
.next p{margin:.25rem 0 0;font-size:.88rem;color:var(--muted)}
.next .ev{margin-top:.75rem;font-size:.88rem;color:color-mix(in srgb,var(--fg) 80%,transparent)}
.p4p{border-top:1px solid var(--border);background:var(--card)}
.p4p ol{list-style:none;margin:2rem 0 0;padding:0;border:1px solid var(--border);border-radius:.9rem;overflow:hidden;background:var(--bg)}
.p4p li{display:grid;grid-template-columns:2.5rem 1fr auto;gap:.75rem;align-items:center;padding:.8rem 1rem;border-bottom:1px solid var(--border)}
.p4p li:last-child{border-bottom:0}
.p4p .r{font-family:var(--display);font-weight:600;font-size:1.25rem;color:var(--primary)}
.page{padding-top:2.5rem;padding-bottom:4rem}
.page h1{font-size:clamp(2.8rem,9vw,3.8rem);margin-top:.5rem}
.page .intro{max-width:42rem;margin:.8rem 0 0;color:var(--muted);font-size:.95rem;line-height:1.6}
.toolbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 4rem);z-index:40;margin:2rem -1rem 0;padding:.75rem 1rem;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.search{width:100%;min-height:2.75rem;padding:0 1rem;border-radius:.6rem;border:1px solid var(--border);background:var(--card);color:var(--fg);font:inherit;font-size:.95rem}
.search:focus{outline:2px solid var(--primary);outline-offset:1px}
.chips{display:flex;gap:.5rem;overflow-x:auto;padding:.7rem 0 .1rem;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:.5rem .8rem;border-radius:999px;border:1px solid var(--border);background:var(--card);font-size:.85rem;transition:border-color .15s,color .15s}
.chip:hover{border-color:color-mix(in srgb,var(--primary) 55%,transparent);color:var(--primary)}
.chip.p{border-color:color-mix(in srgb,var(--primary) 45%,transparent);background:color-mix(in srgb,var(--primary) 12%,transparent);color:var(--primary)}
.sheets{margin-top:2rem;display:grid;gap:2rem}
.sheet{background:var(--card);border:1px solid var(--border);border-radius:.9rem;overflow:hidden}
.sheet.em{border-color:color-mix(in srgb,var(--primary) 40%,transparent)}
.sheet>.h{padding:1rem 1.25rem;border-bottom:1px solid var(--border)}
.sheet>.h h2{font-family:var(--display);text-transform:uppercase;font-weight:600;font-size:1.5rem;margin:0}
.sheet>.h p{margin:.15rem 0 0;font-size:.88rem;color:var(--muted)}
.sheet ol{list-style:none;margin:0;padding:0}
.fr{display:grid;grid-template-columns:2.75rem 1fr auto;gap:.2rem .75rem;align-items:center;padding:.75rem 1rem;border-bottom:1px solid var(--border)}
.fr:last-child{border-bottom:0}
.fr .m{grid-row:span 2;text-align:center;font-family:var(--display);font-weight:600;font-size:1.1rem;color:var(--primary)}
.fr.c{border-left:2px solid var(--primary);background:color-mix(in srgb,var(--primary) 10%,transparent)}
.fr.c .m{align-self:start;margin-top:.1rem;background:var(--primary);color:#fff;font-size:.72rem;font-weight:700;border-radius:.25rem;padding:.3rem 0}
.fr.c .nm{font-weight:600}
.fr .nm{font-weight:500}
.fr .rec{font-size:.88rem;color:var(--muted)}
.fr .fm{grid-column:2/4;font-size:.75rem;line-height:1.5;color:var(--muted)}
.fr .fm i{display:block;font-style:normal;opacity:.7}
@media(min-width:640px){
  .fr{grid-template-columns:2.75rem minmax(0,1.2fr) 5rem minmax(0,1fr)}
  .fr .m{grid-row:auto}
  .fr .fm{grid-column:4;text-align:right}
}
.empty{border:1px solid var(--border);background:var(--card);border-radius:.9rem;padding:2rem;text-align:center}
.empty p{margin:0;font-weight:500}
.empty button{margin-top:.75rem;background:none;border:0;color:var(--primary);font-weight:500;padding:.5rem}
.events{list-style:none;margin:2.25rem 0 0;padding:0;display:grid;gap:1.25rem}
.ev-card{background:var(--card);border:1px solid var(--border);border-radius:.9rem;overflow:hidden}
.ev-card .h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:.25rem 1rem;padding:1rem 1.25rem;border-bottom:1px solid var(--border)}
.ev-card h2{font-family:var(--display);text-transform:uppercase;font-weight:600;font-size:1.5rem;margin:0}
.ev-card .d{font-size:.88rem;font-weight:500;letter-spacing:.04em;color:var(--primary)}
.ev-card ul{list-style:none;margin:0;padding:0}
.ev-card li{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.25rem 1rem;padding:.9rem 1.25rem;border-bottom:1px solid var(--border)}
.ev-card li:last-child{border-bottom:0}
.ev-card li p{margin:0;font-weight:500}
.ev-card li p em{font-style:normal;color:var(--muted);padding:0 .3rem;font-weight:400}
.tag{background:color-mix(in srgb,var(--primary) 16%,transparent);color:var(--primary);font-size:.7rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:.2rem .5rem;border-radius:.25rem}
footer.foot{border-top:1px solid var(--border)}
footer.foot .wrap{display:flex;flex-direction:column;gap:1rem;padding-top:2.5rem;padding-bottom:2.5rem}
footer.foot p{margin:0;max-width:28rem;font-size:.88rem;line-height:1.6;color:var(--muted)}
@media(min-width:640px){footer.foot .wrap{flex-direction:row;justify-content:space-between;align-items:flex-end}footer.foot p{text-align:right}}
.fr[data-id]{cursor:pointer;transition:background .15s}
.fr[data-id]:hover{background:color-mix(in srgb,var(--primary) 7%,transparent)}
.fr.sel{box-shadow:inset 0 0 0 2px var(--primary);background:color-mix(in srgb,var(--primary) 14%,transparent)}
.fr.sel .nm::after{content:" ✓";color:var(--primary);font-weight:700}
.hint{margin:.75rem 0 0;font-size:.85rem;color:var(--muted)}
.tray{position:fixed;left:0;right:0;bottom:0;z-index:60;padding:.75rem 1rem calc(.75rem + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--border)}
.tray[hidden]{display:none}
.tray .in{max-width:72rem;margin:0 auto;display:flex;align-items:center;gap:.75rem}
.tray .who{flex:1;min-width:0;font-size:.9rem;line-height:1.35}
.tray .who b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tray .who span{color:var(--muted);font-size:.8rem}
.tray .btn{min-height:2.75rem;cursor:pointer}
.tray .btn[disabled]{opacity:.4;cursor:default}
.tray .clr{background:none;border:0;color:var(--muted);padding:.5rem;font-size:.85rem;cursor:pointer}
.pick{display:grid;gap:.75rem;margin-top:2rem}
@media(min-width:640px){.pick{grid-template-columns:1fr 1fr}}
.pick label{display:block;font-size:.72rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:.35rem}
.pick select{width:100%;min-height:2.75rem;padding:0 .75rem;border-radius:.6rem;border:1px solid var(--border);background:var(--card);color:var(--fg);font:inherit;font-size:.95rem}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:.5rem;align-items:stretch;margin-top:1.5rem}
.vs .mid{align-self:center;font-family:var(--display);font-weight:600;color:var(--muted);letter-spacing:.1em}
.fcard{background:var(--card);border:1px solid var(--border);border-radius:.9rem;padding:1rem;text-align:center;min-width:0}
.fcard h2{font-size:clamp(1.15rem,4.6vw,1.8rem);margin:.4rem 0 0;line-height:1.1;overflow-wrap:anywhere}
.fcard .rec{display:block;margin-top:.4rem;color:var(--muted);font-size:.9rem}
.fcard .eyebrow{font-size:.62rem;letter-spacing:.14em}
.badge{display:inline-block;margin-top:.6rem;padding:.2rem .55rem;border-radius:.3rem;font-size:.72rem;font-weight:700;background:var(--accent)}
.badge.c{background:var(--primary);color:#fff}
.cmp{margin-top:1.5rem;background:var(--card);border:1px solid var(--border);border-radius:.9rem;overflow:hidden}
.cmp h3{margin:0;padding:.8rem 1rem;font-size:.72rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);background:var(--accent)}
.cr{display:grid;grid-template-columns:1fr minmax(0,1.15fr) 1fr;gap:.5rem;align-items:center;padding:.75rem 1rem;border-bottom:1px solid var(--border);text-align:center}
.cr:last-child{border-bottom:0}
.cr .l{font-size:.78rem;color:var(--muted);line-height:1.3}
.cr .v{font-weight:600;font-variant-numeric:tabular-nums;font-size:1.05rem;border-radius:.4rem;padding:.2rem 0}
.cr .v.na{color:var(--muted);font-weight:400}
.cr .v.win{color:var(--primary);background:color-mix(in srgb,var(--primary) 12%,transparent)}
.note{margin:1rem 0 0;font-size:.82rem;line-height:1.55;color:var(--muted)}
.fx-composer{margin-top:2rem;background:var(--card);border:1px solid var(--border);border-radius:.9rem;padding:1rem}
.fx-types{display:flex;gap:.5rem;margin-bottom:.75rem}
.fx-types button{flex:1;min-height:2.5rem;border-radius:.6rem;border:1px solid var(--border);background:var(--bg);cursor:pointer;font-weight:600;font-size:.88rem}
.fx-types button[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:#fff}
.fx-composer textarea,.fx-reply textarea{width:100%;min-height:5.5rem;resize:vertical;padding:.7rem .85rem;border-radius:.6rem;border:1px solid var(--border);background:var(--bg);color:var(--fg);font:inherit;font-size:.95rem;line-height:1.5}
.fx-composer textarea:focus,.fx-reply textarea:focus{outline:2px solid var(--primary);outline-offset:1px}
.fx-composer textarea:disabled{opacity:.55}
.fx-row{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-top:.6rem}
.fx-count{font-size:.8rem;color:var(--muted)}
.fx-note{margin:.75rem 0 0;font-size:.85rem;line-height:1.5;color:var(--muted)}
.fx-filter{display:flex;gap:.5rem;margin-top:1.5rem;overflow-x:auto;scrollbar-width:none}
.fx-filter button{flex:none;padding:.5rem .85rem;border-radius:999px;border:1px solid var(--border);background:var(--card);font-size:.85rem;cursor:pointer}
.fx-filter button[aria-pressed="true"]{border-color:var(--primary);color:var(--primary);background:color-mix(in srgb,var(--primary) 12%,transparent)}
.fx-feed{list-style:none;margin:1rem 0 0;padding:0;display:grid;gap:.9rem}
.fx-post{background:var(--card);border:1px solid var(--border);border-radius:.9rem;padding:1rem 1.1rem}
.fx-head{display:flex;align-items:center;gap:.6rem;font-size:.85rem;color:var(--muted)}
.fx-av{flex:none;width:1.9rem;height:1.9rem;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--fg);font-weight:700;font-size:.8rem}
.fx-head b{color:var(--fg);font-weight:600}
.fx-tag{margin-left:auto;font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:.15rem .45rem;border-radius:.25rem;background:var(--accent)}
.fx-tag.q{background:color-mix(in srgb,var(--primary) 16%,transparent);color:var(--primary)}
.fx-text{margin:.7rem 0 0;line-height:1.6;font-size:.95rem;overflow-wrap:anywhere}
.fx-acts{display:flex;gap:1rem;margin-top:.7rem}
.fx-acts button{background:none;border:0;padding:.35rem 0;font-size:.82rem;color:var(--muted);cursor:pointer}
.fx-acts button:hover{color:var(--fg)}
.fx-acts button.danger{color:var(--primary)}
.fx-replies{margin:.8rem 0 0;padding:.2rem 0 0 .9rem;border-left:2px solid var(--border);display:grid;gap:.7rem}
.fx-rep .fx-head{font-size:.8rem}
.fx-rep .fx-text{margin-top:.3rem;font-size:.9rem}
.fx-reply{margin-top:.8rem}
.fx-reply textarea{min-height:3.5rem}
@media(max-width:520px){
  header.top{position:static}
  header.top .wrap{height:auto;flex-wrap:wrap;padding-top:.7rem;padding-bottom:.3rem;row-gap:.15rem}
  nav.main{width:100%;justify-content:space-between;overflow:visible}
  nav.main a{padding:.55rem .3rem;font-size:.8rem}
  .toolbar{top:env(safe-area-inset-top,0px)}
}
@media(max-width:380px){nav.main a{padding:.55rem .2rem;font-size:.74rem}}
nav.main{overflow-x:auto;scrollbar-width:none;min-width:0}
nav.main::-webkit-scrollbar{display:none}
nav.main a{white-space:nowrap}
.hl{list-style:none;margin:2.25rem 0 0;padding:0;display:grid;gap:1.5rem}
.hl-card{background:var(--card);border:1px solid var(--border);border-radius:.9rem;overflow:hidden}
.hl-card>.h{padding:1.1rem 1.25rem;border-bottom:1px solid var(--border)}
.hl-card>.h h2{font-family:var(--display);text-transform:uppercase;font-weight:600;font-size:1.6rem;margin:0}
.hl-card>.h p{margin:.25rem 0 0;font-size:.88rem;color:var(--muted)}
.hl-card .sum{margin:0;padding:1rem 1.25rem;font-size:.92rem;line-height:1.6;color:color-mix(in srgb,var(--fg) 85%,transparent);border-bottom:1px solid var(--border)}
.hl-card h3{margin:0;padding:.7rem 1.25rem;font-size:.72rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);background:var(--accent)}
.hl-card ul{list-style:none;margin:0;padding:0}
.hl-card li{padding:.8rem 1.25rem;border-bottom:1px solid var(--border);display:grid;gap:.15rem}
.hl-card li:last-child{border-bottom:0}
.hl-card li b{font-weight:600}
.hl-card li span{font-size:.85rem;color:var(--muted)}

    if(d.championNextFight) entries.push([d.champion, d.championNextFight]);
    for(const f of d.fighters) if(f.nextFight) entries.push([f.name, f.nextFight]);
  }
  const events = new Map(), seen = new Set();
  for(const [fighter, fight] of entries){
    const date = parseDate(fight.date);
    if(!date || date < today) continue;
    const opp = splitOpp(fight.opponent);
    const bk = fight.date+"|"+fight.event+"|"+[fighter,opp.name].sort().join(" vs ");
    if(seen.has(bk)) continue; seen.add(bk);
    const key = fight.date+"|"+fight.event;
    if(!events.has(key)) events.set(key,{event:fight.event,dateLabel:fight.date,date,bouts:[]});
    events.get(key).bouts.push({a:fighter,b:opp.name,title:/titel/i.test(opp.note||"")});
  }
  const list = [...events.values()];
  list.forEach(e => e.bouts.sort((x,y)=>y.title-x.title));
  return list.sort((x,y)=>x.date-y.date);
}

const slug = s => s.replace(/ł/g,"l").replace(/Ł/g,"L").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const FIGHTERS = new Map();
for(const d of divisions){
  FIGHTERS.set(slug(d.champion),{id:slug(d.champion),name:d.champion,record:d.championRecord,division:d.name,divisionEn:d.nameEn,weight:d.weightLimit,rank:"C",next:d.championNextFight});
  for(const f of d.fighters){
    const id = slug(f.name);
    if(!FIGHTERS.has(id)) FIGHTERS.set(id,{id,name:f.name,record:f.record,division:d.name,divisionEn:d.nameEn,weight:d.weightLimit,rank:f.rank,next:f.nextFight});
  }
}
for(const f of poundForPound){
  const id = slug(f.name), ex = FIGHTERS.get(id);
  if(ex){ ex.p4p = f.rank; if(!ex.next && f.nextFight) ex.next = f.nextFight; }
  else FIGHTERS.set(id,{id,name:f.name,record:f.record,division:null,rank:null,p4p:f.rank,next:f.nextFight});
}
function recParts(rec){
  const m = String(rec).match(/(\d+)-(\d+)-(\d+)/);
  if(!m) return null;
  const w=+m[1], l=+m[2], d=+m[3], n=w+l+d;
  return {w,l,d,n,pct:n?Math.round(w/n*100):null};
}

/* ---------- Urval & jämförelse ---------- */
let selected = [];
function toggleSelect(id){
  if(!FIGHTERS.has(id)) return;
  const i = selected.indexOf(id);
  if(i>=0) selected.splice(i,1);
  else { if(selected.length>=2) selected.shift(); selected.push(id); }
  syncSelection();
}
function syncSelection(){
  document.querySelectorAll(".fr[data-id]").forEach(el=>{
    const on = selected.includes(el.dataset.id);
    el.classList.toggle("sel", on); el.setAttribute("aria-pressed", on);
  });
  updateTray();
}
function updateTray(){
  const tray = document.getElementById("tray");
  const onRanking = (location.hash.replace(/^#\/?/,"").split("/")[0]) === "ranking";
  if(!onRanking || !selected.length){ tray.hidden = true; return; }
  const names = selected.map(id=>FIGHTERS.get(id).name);
  const ready = selected.length===2;
  tray.hidden = false;
  tray.innerHTML = `<div class="in"><div class="who"><b>${names.map(esc).join(" mot ")}</b><span>${ready?"Redo att jämföra":"Välj en fighter till"}</span></div>
    <button class="clr" type="button" id="trayClr">Rensa</button>
    <button class="btn primary" type="button" id="trayGo" ${ready?"":"disabled"}>Jämför</button></div>`;
  document.getElementById("trayClr").onclick = () => { selected = []; syncSelection(); };
  document.getElementById("trayGo").onclick = () => { if(selected.length===2) location.hash = "#/jamfor/"+selected[0]+"/"+selected[1]; };
}

  {label:"Stance", get:f=>STATS[f.id]?.stance ?? null, fmt:v=>v==null?"—":v, better:null},
 ]},
 {title:"Striking", rows:[
  {label:"Träffade slag per min", get:f=>STATS[f.id]?.slpm ?? null, fmt:fmtNum(2), better:"high"},
  {label:"Slag-träffsäkerhet", get:f=>STATS[f.id]?.acc ?? null, fmt:fmtNum(0,"%"), better:"high"},

 ]},
 {title:"Grappling", rows:[
  {label:"Takedowns per 15 min", get:f=>STATS[f.id]?.tdAvg ?? null, fmt:fmtNum(2), better:"high"},
  {label:"Takedown-träffsäkerhet", get:f=>STATS[f.id]?.tdAcc ?? null, fmt:fmtNum(0,"%"), better:"high"},

 ]},

function winnerSide(row,a,b){
  const va=row.get(a), vb=row.get(b);
  if(!row.better || va==null || vb==null || va===vb) return null;
  return (row.better==="high" ? va>vb : va<vb) ? "a" : "b";
}
function rankBadge(f){
  if(!f) return "";
  if(f.rank==="C") return `<span class="badge c">Mästare</span>`;
  if(f.rank) return `<span class="badge">#${f.rank} i viktklassen</span>`;
  return `<span class="badge">P4P #${f.p4p}</span>`;
}
function fcard(f,empty){
  if(!f) return `<div class="fcard"><p class="muted" style="margin:1.5rem 0">${empty}</p></div>`;
  return `<div class="fcard"><p class="eyebrow">${esc(f.division||"Pound-for-pound")}</p><h2 class="display">${esc(f.name)}</h2><span class="rec">${esc(f.record)}</span>${rankBadge(f)}</div>`;
}
function optionsHtml(sel){
  const groups = divisions.map(d=>{
    const ids = [...FIGHTERS.values()].filter(f=>f.division===d.name);
    ids.sort((x,y)=>(x.rank==="C"?0:x.rank)-(y.rank==="C"?0:y.rank));
    return `<optgroup label="${esc(d.name)}">${ids.map(f=>`<option value="${f.id}"${f.id===sel?" selected":""}>${f.rank==="C"?"C":f.rank}. ${esc(f.name)}</option>`).join("")}</optgroup>`;
  });
  const only = [...FIGHTERS.values()].filter(f=>!f.division);
  if(only.length) groups.push(`<optgroup label="Pound-for-pound">${only.map(f=>`<option value="${f.id}"${f.id===sel?" selected":""}>${esc(f.name)}</option>`).join("")}</optgroup>`);
  return `<option value="">Välj fighter…</option>`+groups.join("");
}
function compareView(aId,bId){
  const a = FIGHTERS.get(aId), b = FIGHTERS.get(bId);
  let body = "";
  if(a && b){
    body = CMP_GROUPS.map(g=>({...g,rows:g.rows.filter(r=>r.get(a)!=null||r.get(b)!=null)})).filter(g=>g.rows.length).map(g=>`<div class="cmp"><h3>${g.title}</h3>${g.rows.map(r=>{
      const w = winnerSide(r,a,b), va=r.get(a), vb=r.get(b);
      return `<div class="cr"><span class="v${va==null?" na":""}${w==="a"?" win":""}">${r.fmt(va)}</span><span class="l">${r.label}</span><span class="v${vb==null?" na":""}${w==="b"?" win":""}">${r.fmt(vb)}</span></div>`;
    }).join("")}</div>`).join("");
    const next = f => f.next ? `${esc(f.next.date)} · ${esc(f.next.opponent)}<br><span class="muted" style="font-size:.8rem">${esc(f.next.event)}</span>` : `<span class="muted">Ingen match inlagd</span>`;
    body += `<div class="cmp"><h3>Nästa match</h3><div class="cr" style="align-items:start"><span style="font-size:.9rem">${next(a)}</span><span class="l">Datum och motståndare</span><span style="font-size:.9rem">${next(b)}</span></div></div>`;
    const missing = [a,b].filter(f=>STATS[f.id]?.slpm==null).map(f=>f.name);
    body += `<p class="note">${missing.length?`Strike- och takedown-statistik saknas i databasen för ${missing.map(esc).join(" och ")} (visas som “—”). `:""}Statistiken är karriärsnitt från UFC.com/UFCStats (databas från juni 2026) och kan ligga efter de senaste matcherna. Slag- och takedown-försvar visas bara där källan har dem. Rekordet överst kommer från rankinglistan. Den markerade siffran är den bättre i varje rad.</p>`;
  } else {

const FORUM = {db:null,user:null,uid:null,canWrite:null,canModerate:false,posts:[],replies:[],names:{},
  state:"loading",filter:"alla",kind:"fraga",busy:false,openReply:null,confirmDel:null,drafts:{},err:""};
const MAXLEN = 600;
/* Länk till en extern community (t.ex. Discord). Fyll i för att visa en knapp när forumet inte är tillgängligt. */
const COMMUNITY_URL = "";

function relTime(ms){
  const s = Math.round((Date.now()-ms)/1000);
  if(s<45) return "nyss";
  const m = Math.round(s/60); if(m<60) return m+" min sedan";
  const h = Math.round(m/60); if(h<24) return h+" tim sedan";
  const d = Math.round(h/24); if(d<7) return d+" dygn sedan";
  return new Date(ms).toLocaleDateString("sv-SE",{day:"numeric",month:"short",year:"numeric"});
}
const nameOf = id => id && id===FORUM.uid ? "Du" : (FORUM.names[id] || "Gäst");
const textHtml = s => esc(s).replace(/\n/g,"<br>");

async function resolveNames(){
  if(!FORUM.user) return;
  const ids = [...new Set([...FORUM.posts,...FORUM.replies].map(x=>x.authorId).filter(Boolean))].filter(id=>!(id in FORUM.names));
  if(!ids.length) return;
  try{
    const ps = await FORUM.user.profiles(ids);
    for(const id of ids) FORUM.names[id] = (ps && ps[id] && ps[id].name) || "";
    paintForum();
  }catch(e){ for(const id of ids) FORUM.names[id] = ""; }
}

async function initForum(){
  if(!window.claude || !claude.use){ FORUM.state="off"; paintForum(); return; }
  try{
    const [db,user] = await Promise.all([claude.use("db"),claude.use("user")]);
    FORUM.db = db; FORUM.user = user;
    if(!db){ FORUM.state="off"; paintForum(); return; }
    if(user){
      FORUM.uid = await user.id();
      FORUM.canWrite = await user.can("data.write");
      FORUM.canModerate = await user.canEdit();
    }
    const onErr = e => { FORUM.state = (e && e.code==="revoked") ? "off" : "error"; paintForum(); };
    db.collection("forum_posts").orderBy("createdAt","desc").limit(200).onSnapshot(snap=>{
      FORUM.posts = snap.docs.map(d=>({id:d.id,...d.data()}));
      FORUM.state = "ready"; paintForum(); resolveNames();
    },onErr);
    db.collection("forum_replies").orderBy("createdAt","asc").limit(600).onSnapshot(snap=>{
      FORUM.replies = snap.docs.map(d=>({id:d.id,...d.data()}));
      paintForum(); resolveNames();
    },onErr);
  }catch(e){ FORUM.state="error"; paintForum(); }
}

}

function paintForum(){
  const feed = document.getElementById("fxFeed");
  if(!feed) return;                      // not on the forum page
  const comp = document.getElementById("fxComposer");
  const canPost = FORUM.state==="ready" && FORUM.canWrite!==false && !!FORUM.db;

  /* composer (rebuilt only when its mode changes, so typing is never lost) */
  const mode = FORUM.state+"|"+canPost;
  if(comp.dataset.mode !== mode){
    comp.dataset.mode = mode;
    let note = "";
    if(FORUM.state==="loading") note = "Laddar forumet…";
    else if(FORUM.state==="off") note = "Forumet fungerar bara när sidan öppnas via claude.ai av inloggade besökare med åtkomst. Övriga delar av sidan fungerar överallt.";
    else if(FORUM.state==="error") note = "Forumet kunde inte laddas just nu. Försök igen om en stund.";
    else if(!canPost) note = "Du kan läsa forumet, men din behörighet tillåter inte att skriva inlägg.";
    const ext = (FORUM.state==="off" || FORUM.state==="error") && COMMUNITY_URL ? `<p style="margin:1rem 0 0"><a class="btn primary" href="${esc(COMMUNITY_URL)}" target="_blank" rel="noopener noreferrer">Gå till communityn ↗</a></p>` : "";
    comp.innerHTML = canPost ? `
      <div class="fx-types"><button type="button" data-kind="fraga" aria-pressed="${FORUM.kind==="fraga"}">Fråga</button><button type="button" data-kind="kommentar" aria-pressed="${FORUM.kind==="kommentar"}">Kommentar</button></div>
      <textarea id="fxText" maxlength="${MAXLEN}" placeholder="${FORUM.kind==="fraga"?"Vad undrar du över?":"Vad tycker du?"}" aria-label="Ditt inlägg"></textarea>
      <div class="fx-row"><span class="fx-count" id="fxCount">0 / ${MAXLEN}</span><button class="btn primary" type="button" id="fxSend">Publicera</button></div>
      <p class="fx-note" id="fxErr" hidden></p>` : `<p class="fx-note" style="margin:0">${esc(note)}</p>${ext}`;
    if(canPost){
      comp.querySelectorAll("[data-kind]").forEach(b=>b.onclick=()=>{
        FORUM.kind=b.dataset.kind;
        comp.querySelectorAll("[data-kind]").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.kind===FORUM.kind)));
        document.getElementById("fxText").placeholder = FORUM.kind==="fraga"?"Vad undrar du över?":"Vad tycker du?";
      });
      const ta = document.getElementById("fxText");
      ta.addEventListener("input",()=>{ document.getElementById("fxCount").textContent = ta.value.length+" / "+MAXLEN; });
      document.getElementById("fxSend").onclick = submitPost;
    }
  }

  /* filter chips */
  const nQ = FORUM.posts.filter(p=>p.kind==="fraga").length, nC = FORUM.posts.filter(p=>p.kind!=="fraga").length;
  const fl = document.getElementById("fxFilter");
  fl.innerHTML = FORUM.state==="ready" ? [["alla","Alla ("+FORUM.posts.length+")"],["fraga","Frågor ("+nQ+")"],["kommentar","Kommentarer ("+nC+")"]]
    .map(([k,l])=>`<button type="button" data-filter="${k}" aria-pressed="${FORUM.filter===k}">${l}</button>`).join("") : "";
  fl.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{ FORUM.filter=b.dataset.filter; paintForum(); });

  /* keep reply drafts and focus across repaints */
  feed.querySelectorAll("textarea[data-reply]").forEach(x=>{ FORUM.drafts[x.dataset.reply]=x.value; });
  const focusId = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.reply : null;

  if(FORUM.state!=="ready"){ feed.innerHTML = ""; return; }
  const list = FORUM.posts.filter(p=>FORUM.filter==="alla" || (FORUM.filter==="fraga" ? p.kind==="fraga" : p.kind!=="fraga"));
  if(!list.length){
    feed.innerHTML = `<li class="empty"><p>${FORUM.posts.length?"Inga inlägg i den här kategorin.":"Inga inlägg ännu."}</p>${FORUM.posts.length||!canPost?"":'<p class="muted" style="font-weight:400;margin-top:.4rem;font-size:.9rem">Bli först med att ställa en fråga.</p>'}</li>`;
    return;
  }
  const byPost = {};
  for(const r of FORUM.replies) (byPost[r.postId] = byPost[r.postId] || []).push(r);
  const mine = x => FORUM.uid && x.authorId===FORUM.uid;
  const canDel = x => FORUM.canModerate || mine(x);
  const head = x => `<div class="fx-head"><span class="fx-av" aria-hidden="true">${esc(nameOf(x.authorId).slice(0,1).toUpperCase())}</span><span><b>${esc(nameOf(x.authorId))}</b> · ${relTime(x.createdAt||Date.now())}</span>`;
  feed.innerHTML = list.map(p=>{
    const reps = byPost[p.id] || [];
    const confirmP = FORUM.confirmDel===p.id;
    return `<li class="fx-post" data-id="${esc(p.id)}">
      ${head(p)}<span class="fx-tag ${p.kind==="fraga"?"q":""}">${p.kind==="fraga"?"Fråga":"Kommentar"}</span></div>
      <p class="fx-text">${textHtml(p.text||"")}</p>
      <div class="fx-acts">
        ${canPost?`<button type="button" data-act="reply" data-id="${esc(p.id)}">Svara${reps.length?" ("+reps.length+")":""}</button>`:(reps.length?`<span class="muted" style="font-size:.82rem">${reps.length} svar</span>`:"")}
        ${canDel(p)?`<button type="button" class="danger" data-act="delpost" data-id="${esc(p.id)}">${confirmP?"Bekräfta borttagning":"Ta bort"}</button>`:""}
      </div>
      ${reps.length?`<ul class="fx-replies" style="list-style:none;margin-left:0">${reps.map(r=>`<li class="fx-rep">${head(r)}</div><p class="fx-text">${textHtml(r.text||"")}</p>
        ${canDel(r)?`<div class="fx-acts"><button type="button" class="danger" data-act="delrep" data-id="${esc(r.id)}">${FORUM.confirmDel===r.id?"Bekräfta borttagning":"Ta bort"}</button></div>`:""}</li>`).join("")}</ul>`:""}
      ${canPost && FORUM.openReply===p.id?`<div class="fx-reply"><textarea data-reply="${esc(p.id)}" maxlength="${MAXLEN}" placeholder="Skriv ett svar…" aria-label="Ditt svar">${esc(FORUM.drafts[p.id]||"")}</textarea>
        <div class="fx-row"><span></span><button class="btn primary" type="button" data-act="sendrep" data-id="${esc(p.id)}">Skicka svar</button></div></div>`:""}
    </li>`;
  }).join("");
  if(focusId){ const el = feed.querySelector('textarea[data-reply="'+CSS.escape(focusId)+'"]'); if(el){ el.focus(); el.setSelectionRange(el.value.length,el.value.length); } }
}

function forumError(msg){
  const e = document.getElementById("fxErr");
  if(e){ e.textContent = msg; e.hidden = !msg; }
}
function describeErr(e){
  const c = e && e.code;
  if(c==="invalid_argument") return "Du har inte behörighet att skriva här.";
  if(c==="quota_exceeded") return "Forumet är fullt just nu.";
  if(c==="resource_exhausted") return "För många försök. Vänta en stund och prova igen.";
  return "Det gick inte att spara. Försök igen.";
}

async function submitPost(){
  const ta = document.getElementById("fxText"); if(!ta || FORUM.busy || !FORUM.db) return;
  const text = ta.value.trim();
  if(!text){ forumError("Skriv något först."); return; }
  if(text.length>MAXLEN){ forumError("Inlägget är för långt."); return; }
  FORUM.busy = true; forumError("");
  const btn = document.getElementById("fxSend"); if(btn) btn.disabled = true;
  try{
    await FORUM.db.collection("forum_posts").add({kind:FORUM.kind,text,authorId:FORUM.uid||"",createdAt:Date.now()});
    ta.value = ""; const c = document.getElementById("fxCount"); if(c) c.textContent = "0 / "+MAXLEN;
  }catch(e){ forumError(describeErr(e)); }
  finally{ FORUM.busy = false; if(btn) btn.disabled = false; }
}

async function submitReply(postId){
  const ta = document.querySelector('textarea[data-reply="'+CSS.escape(postId)+'"]'); if(!ta || FORUM.busy || !FORUM.db) return;
  const text = ta.value.trim(); if(!text) return;
  FORUM.busy = true;
  try{
    await FORUM.db.collection("forum_replies").add({postId,text,authorId:FORUM.uid||"",createdAt:Date.now()});
    delete FORUM.drafts[postId]; FORUM.openReply = null; paintForum();
  }catch(e){ forumError(describeErr(e)); }
  finally{ FORUM.busy = false; }
}

async function deletePost(id){
  if(!FORUM.db) return;
  try{
    for(const r of FORUM.replies.filter(r=>r.postId===id)) await FORUM.db.doc("forum_replies/"+r.id).delete();
    await FORUM.db.doc("forum_posts/"+id).delete();
  }catch(e){ forumError(describeErr(e)); }
}
async function deleteReply(id){
  if(!FORUM.db) return;
  try{ await FORUM.db.doc("forum_replies/"+id).delete(); }catch(e){ forumError(describeErr(e)); }
}

function bindForumFeed(){
  const feed = document.getElementById("fxFeed");
  feed.addEventListener("click",e=>{
    const b = e.target.closest("[data-act]"); if(!b) return;
    const id = b.dataset.id, act = b.dataset.act;
    if(act==="reply"){ FORUM.openReply = FORUM.openReply===id ? null : id; paintForum(); }
    else if(act==="sendrep"){ submitReply(id); }
    else if(act==="delpost" || act==="delrep"){
      if(FORUM.confirmDel===id){ FORUM.confirmDel = null; act==="delpost" ? deletePost(id) : deleteReply(id); }
      else { FORUM.confirmDel = id; paintForum(); }
    }
  });
}

/* ---------- Router ---------- */
function route(){
  const parts = location.hash.replace(/^#\/?/,"").split("/").filter(Boolean);
  const page = parts[0] || "home", sub = parts[1], sub2 = parts[2];
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("active", a.dataset.r === page));
  const act = document.querySelector("#nav a.active"), navEl = document.getElementById("nav");
  if(act && navEl && navEl.scrollWidth > navEl.clientWidth) navEl.scrollLeft = act.offsetLeft - (navEl.clientWidth - act.offsetWidth)/2;
  if(page==="home"){ app.innerHTML = homeView(); scrollTo(0,0); }
  else if(page==="ranking"){
    app.innerHTML = rankingView();
    renderSheets();
    const q = document.getElementById("q");
    q.addEventListener("input", () => { rankQuery = q.value; renderSheets(); });
    const sheets = document.getElementById("sheets");
    sheets.addEventListener("click", e => { const r = e.target.closest(".fr[data-id]"); if(r) toggleSelect(r.dataset.id); });
    sheets.addEventListener("keydown", e => {
      if(e.key!=="Enter" && e.key!==" ") return;
      const r = e.target.closest(".fr[data-id]"); if(r){ e.preventDefault(); toggleSelect(r.dataset.id); }
    });
    if(sub){
      const el = document.getElementById(sub);
      if(el) requestAnimationFrame(()=>{
        const tb = document.querySelector(".toolbar");
        const stick = tb ? (parseFloat(getComputedStyle(tb).top)||0) + tb.offsetHeight : 0;
        scrollTo(0, el.getBoundingClientRect().top + scrollY - stick - 10);
      });
    } else scrollTo(0,0);
  }
  else if(page==="galor"){ app.innerHTML = eventsView(); scrollTo(0,0); }
  else if(page==="highlights"){ app.innerHTML = highlightsView(); scrollTo(0,0); }
  else if(page==="forum"){ app.innerHTML = forumView(); bindForumFeed(); paintForum(); scrollTo(0,0); }
  else if(page==="jamfor"){
    if(sub || sub2) selected = [sub,sub2].filter(id => id && FIGHTERS.has(id));
    const [a,b] = selected;
    app.innerHTML = compareView(a,b);
    const go = () => {
      const x = document.getElementById("selA").value, y = document.getElementById("selB").value;
      selected = [x,y].filter(Boolean);
      location.hash = "#/jamfor" + (x?"/"+x:(y?"/-":"")) + (y?"/"+y:"");
    };
    document.getElementById("selA").onchange = go;
    document.getElementById("selB").onchange = go;
    scrollTo(0,0);
  }
  else { app.innerHTML = notFound(); scrollTo(0,0); }
  updateTray();
  document.title = ({home:"MMAgrid – Ranking, viktklasser och info om UFC",ranking:"UFC Ranking – Alla viktklasser | MMAgrid",galor:"Kommande UFC-galor | MMAgrid",jamfor:"Jämför fighters | MMAgrid",highlights:"UFC Highlights | MMAgrid",forum:"Forum | MMAgrid"})[page] || "Sidan hittades inte | MMAgrid";
}
addEventListener("hashchange", route);
route();
initForum();
</script>
